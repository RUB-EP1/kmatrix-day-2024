[project]
name = "kmatrix-day-2024"
version = "0.1.0"
description = "Educational materials for the K-matrix formalism in the field of hadron physics"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [
    { name = "Misha Mikhasenko" },
    { name = "Lena Pöpping" },
    { name = "Ilya Segal" },
    { name = "Remco de Boer" },
]
dependencies = [
    "ampform",
    "ipympl",
    "ipywidgets",
    "matplotlib",
    "plotly",
    "sympy",
]

[dependency-groups]
dev = [
    "ruff",
    "sphinx-autobuild",
    { include-group = "doc" },
    { include-group = "jupyter" }
]
doc = [
    "myst-nb",
    "sphinx-book-theme",
    "sphinx-codeautolink",
    "sphinx-copybutton",
    "sphinx-design"
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-server",
]

[tool.compwa.policy]
dev-python-version = "3.14"
package-manager = "pixi+uv"
repo-name = "kmatrix-day-2024"
repo-organization = "RUB-EP1"
repo-title = "International K-matrix day 2024"

[tool.compwa.policy.format]
no-cspell-update = true

[tool.compwa.policy.github]
dependabot-assignees = ["redeboer"]
dependabot-ecosystems = ["github-actions", "julia", "pre-commit", "uv"]
no-cd = true

[tool.compwa.policy.nb]
no-binder = true

[tool.docstrfmt]
docstring-trailing-line = false
format-python-code-blocks = false

[tool.lychee]
cache = true
cache_exclude_status = "400.."
exclude = [
    # [:] keeps Lychee from extracting regex patterns as URLs.
    '^https[:]//www\.sciencedirect\.com/science/article/pii/0375947472903053$',  # Blocks automated requests (403)
    '^file:///.*/docs/_static/K-matrix\.html$',  # Generated by the documentation build
]
hidden = true
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "7d"

[tool.ruff]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ANN00",
    "ANN20",
    "D",
    "PTH",
    "ambiguous-variable-name",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "outdated-version-block",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-self]
ignore-names = ["_print"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Notebooks should not use postponed evaluation of annotations."

[tool.ruff.lint.isort]
known-third-party = ["sympy"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"!*.ipynb" = ["banned-api"]
"*.ipynb" = [
    "ANN",
    "C90",
    "PLR09",
    "T20",
    "TC00",
    "assert",
    "collection-literal-concatenation",
    "global-statement",
    "global-variable-not-assigned",
    "invalid-argument-name",
    "magic-value-comparison",
    "missing-f-string-syntax",
    "mixed-case-variable-in-global-scope",
    "module-import-not-at-top-of-file",
    "non-lowercase-variable-in-function",
    "start-process-with-partial-path",
    "suspicious-eval-usage",
    "suspicious-subprocess-import",
    "too-many-blank-lines",
    "unnecessary-collection-call",
    "unused-method-argument",
    "useless-expression",
    "useless-semicolon",
]
"docs/*" = [
    "assert",
    "implicit-namespace-package",
    "request-without-timeout",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "undocumented-public-module",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tombi.files]
exclude = [
    "**/Manifest.toml",
    "**/Project.toml",
    "**/uv.lock",
]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.7/compwa-policy.schema.json"
include = ["pyproject.toml"]

[tool.uv]
package = false
