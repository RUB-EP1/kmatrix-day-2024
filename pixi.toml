[workspace]
channels = ["conda-forge", "https://repo.prefix.dev/julia-forge"]
description = "Educational materials for the K-matrix formalism in the field of hadron physics"
name = "kmatrix-day-2024"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[dependencies]
julia = { version = "*", channel = "https://repo.prefix.dev/julia-forge" }
prek = "*"
uv = "*"

[tasks.all]
depends-on = [
    "style",
    "linkcheck",
    "doc",
]
description = "Run style and link checks and build the Julia and Python documentation"

[tasks.upgrade]
depends-on = [
    "_upgrade-pixi",
    "_upgrade-precommit",
    "_upgrade-uv",
    "_upgrade-julia",
]
description = "Upgrade all lock files"

[tasks._upgrade-pixi]
cmd = "pixi update"

[tasks._upgrade-precommit]
cmd = "prek autoupdate"

[tasks._upgrade-julia]
cmd = "julia --eval='using Pkg; Pkg.update()' --project=."

[tasks._upgrade-pluto]
cmd = """
julia --project -e '
    using Pluto
    for (root, dirs, files) in walkdir(".")
        filter!(d -> !startswith(d, "."), dirs)
        for file in filter(endswith(".jl"), files)
            path = joinpath(root, file)
            startswith(readline(path), "### A Pluto.jl notebook ###") || continue
            @info "Updating notebook environment" path
            Pluto.update_notebook_environment(path; backup=false)
        end
    end
'
"""
depends-on = ["_upgrade-julia"]

[tasks.doc]
cmd = "pixi run doc-sphinx"
depends-on = ["doc-julia"]
description = "Build the full documentation, including the exported Pluto notebook"

[tasks.doc-sphinx]
cmd = """
uv run sphinx-build \
    --keep-going \
    -TW \
    -b html \
    docs/ docs/_build/html
"""
description = "Build only the Sphinx documentation as HTML, without exporting the Pluto notebook"

[tasks.doclive]
cmd = """
uv run sphinx-autobuild \
    --open-browser \
    --re-ignore '.*/.ipynb_checkpoints/.*' \
    --re-ignore 'docs/_build/.*' \
    --re-ignore 'docs/_static/.*' \
    --watch docs \
    docs/ docs/_build/html
"""
description = "Serve the documentation with live reload on changes"

[tasks.doc-julia]
cmd = """
julia \
    --project=.. \
    -e 'using PlutoSliderServer; PlutoSliderServer.export_notebook("K-matrix.jl")'
"""
cwd = "docs"
depends-on = ["instantiate-julia"]
description = "Export the Pluto notebook to static HTML for the documentation"

[tasks.instantiate-julia]
cmd = """
julia --project -e 'using Pkg; Pkg.instantiate()'
"""
description = "Install the Julia packages pinned in Manifest.toml"

[tasks.lab]
cmd = "uv run jupyter lab docs"
description = "Launch JupyterLab in the docs folder"

[tasks.style]
cmd = "prek run --all-files"
description = "Run all pre-commit hooks on all files"

[tasks.linkcheck]
cmd = "uvx --from lychee-bin lychee . --quiet"
description = "Check links and fragments in repository sources (requires internet connection)"

[tasks.pluto]
cmd = """
julia \
    --project \
    -e 'using Pluto; Pluto.run(notebook="docs/K-matrix.jl")'
"""
depends-on = ["instantiate-julia"]
description = "Launch Pluto with the K-matrix notebook"

[tasks._upgrade-uv]
cmd = "uv lock --upgrade"
